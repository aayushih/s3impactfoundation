# Netlify reads this file automatically when the site is connected.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# While the site is a preview, ask search engines not to list it.
# Delete this block on launch day (and set preview: false in src/_data/site.yml).
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Photos, styles and scripts can be cached by browsers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
