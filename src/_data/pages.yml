# ── IMPACT ──────────────────────────────────────────────────
impact:
  title: "Our *Impact*"
  intro: "We count what changes: meals served, scores raised, litres cleaned, incomes earned. Then we listen for the stories behind each number."
  image: "journey-food.webp"
  image_alt: "Volunteers serving hot food to a queue of visitors"

  numbers:
    title: "The work in *numbers*"
    intro: "Tap or hover over a number to see where it comes from."
    items:
      - { colour: "coral", icon: "meals.webp", shows: "2.4M", count_to: 2.4, decimals: 1, suffix: "M", label: "Free meals, 2025-26", detail: "Cooked at Govardhan Annakshetra for villagers, schoolchildren, trainees and hospital patients across five talukas.", link: "/projects/govardhan-annakshetra/" }
      - { colour: "s3", icon: "learning.webp", shows: "67%", count_to: 67, suffix: "%", label: "Rise in learning scores", detail: "Average scores rose from 19.85 to 33.16 across 102 tribal residential schools in Palghar.", link: "/projects/ashramshala-education/" }
      - { colour: "leaf", icon: "water.webp", shows: "12,000", count_to: 12000, format: "international", label: "Litres of safe water an hour", detail: "Borewell water at Govardhan Ecovillage now tests free of coliform bacteria and E. coli.", link: "/projects/safe-drinking-water/" }
      - { colour: "saffron", icon: "temple.webp", shows: "81%", count_to: 81, suffix: "%", label: "Women earning within 3 months", detail: "65 of 80 trainees found work or started a business, and report earning ₹4,500 to ₹8,000 more a month.", link: "/projects/womens-skills/" }
      - { colour: "leaf", icon: "", shows: "2,000", count_to: 2000, format: "international", label: "Fruit saplings planted", detail: "Mango, cashew and guava, for 40 tribal farmers growing orchards on their own land.", link: "/projects/fruit-orchards/" }
      - { colour: "s3", icon: "", shows: "55", count_to: 55, label: "EV technicians trained", detail: "A free course at Boisar that ended with students converting a petrol scooter to electric.", link: "/projects/ev-skilling/" }
      - { colour: "saffron", icon: "", shows: "8,11,071", count_to: 811071, format: "indian", label: "Visitors in a year", detail: "Day visitors to Govardhan Ecovillage in 2024-25, up from about one lakh a year.", link: "/projects/vedic-education-cultural-centre/" }
      - { colour: "coral", icon: "", shows: "6", count_to: 6, label: "Sacred kunds in revival", detail: "Priya Kund is now a working model, and natural springs are flowing again at Jal Vihar, Kamal and Vihval Kund.", link: "/our-work/#kunds" }

  stories:
    label: "Stories of life transformation"
    title: "Lives behind the *numbers*"
    items:
      - colour: "leaf"
        project: "fruit-orchards"
        title: "Home, not the work site"
        text: "Two farmers from Sukasale village had left home for daily-wage work. Each planted 20 mango, 20 cashew and 10 guava saplings. Both now tend orchards of their own. For one of them, it was the first support he had ever received."
        link_label: "Fruit Orchards for Palghar’s Small Farmers"
      - colour: "saffron"
        project: "womens-skills"
        title: "A stronger voice at home"
        text: "Within three months of training, 65 of 80 women were earning. They report more say in household decisions, and an alumni network now links each new batch to those who came before."
        link_label: "Skills and Income for Rural and Tribal Women"
      - colour: "coral"
        project: "govardhan-annakshetra"
        title: "One less worry"
        text: "For about 200 patients and carers a day at Bhaktivedanta Hospital, a free meal eases the cost and stress of treatment."
        link_label: "Govardhan Annakshetra"
      - colour: "water"
        project: "ev-skilling"
        title: "From classroom to career"
        text: "Fifty-five young people learned to build electric vehicles. Some were placed with a manufacturer in Pune soon after the course."
        link_label: "Electric Vehicle Skilling Course"

  voices:
    label: "In their words"
    items:
      - text: "I am deeply grateful to S3 Impact Foundation for their generous support of the Food Self-Sufficiency Project at Govardhan Ecovillage."
        name: "Gauranga Das"
        role: "Govardhan Ecovillage"
      - text: "The primary condition of civilization is the availability of an abundance of food, and the primary discipline of civilization is the sharing of that food."
        name: "HG Gauranga Das"
        role: "Director, Govardhan EcoVillage, at the C20 meeting in Recife"

  partners:
    label: "Our partners"
    title: "Stronger *together*"
    text: "Every project rests on many hands: community organisations, government bodies and local residents who care for what is built long after the work is done."
    # To show a logo: upload it to src/assets/img/ and type its file name after logo:
    items:
      - { name: "Govardhan Ecovillage", logo: "" }
      - { name: "UP Braj Teerth Vikas Parishad", logo: "" }
      - { name: "Nandgaon Nagar Panchayat", logo: "" }
      - { name: "Govardhan Skill Centre", logo: "" }
      - { name: "Bhaktivedanta Hospital", logo: "" }

  press:
    label: "In the press"
    title: "Making *news*"
    items:
      - colour: "leaf"
        image: "press-braj.webp"
        image_alt: "Visitors beside the new murals at Priya Kund"
        outlet: "Braj Breaking"
        title: "A Braj Break-through"
        text: "The revival of Braj’s kunds was reported by *Braj Breaking*, a local Braj news site, which called restoring the kunds and cleaning their water the first need of the day."
        link: "/projects/priya-kund-prem-sarovar/"
        link_label: "Read about the kunds"
      - colour: "saffron"
        image: "press-dainik-bhaskar.jpg"
        image_alt: "A Dainik Bhaskar newspaper clipping about the kund revival"
        outlet: "Dainik Bhaskar"
        title: "The kunds, in print"
        text: "*Dainik Bhaskar*, one of India’s largest Hindi dailies, covered the work to clean and revive the sacred ponds of Braj."
        link: "/projects/priya-kund-prem-sarovar/"
        link_label: "Read about the kunds"
      - colour: "water"
        image: "press-lok-bharti.jpg"
        image_alt: "A Lok Bharti newspaper clipping about the kund revival"
        outlet: "Lok Bharti"
        title: "A local story, told locally"
        text: "*Lok Bharti* reported on the revival of the kunds and the villagers who now care for them."
        link: "/projects/priya-kund-prem-sarovar/"
        link_label: "Read about the kunds"

