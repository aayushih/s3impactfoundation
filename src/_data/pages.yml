pillar_colours:
  social: "coral"
  sustainability: "leaf"
  self: "saffron"

# ── ABOUT US ────────────────────────────────────────────────
about:
  title: "About *S3*"
  intro: "S3 Impact Foundation is a charitable foundation based in Mumbai. We serve people, communities and the land, and we stay beside each project long enough to see the lives it changes."
  image: "work-spiritual.webp"
  image_alt: "The carved ceiling and shrine of the renewed temple at Govardhan Ecovillage"

  why:
    label: "Our inspiration"
    title: "Why *S3*"
    paragraphs:
      - "True change is never only material. A family needs food, water, schooling and work. It also needs dignity, purpose and a sense of belonging."
      - "Our name holds these together. S3 stands for three commitments: Social Impact, for the people we serve; Sustainability, for the land that sustains them; and Self Transformation, for the inner growth that makes every other change last."
    pillars:
      - { colour: "coral", name: "Social Impact", line: "For the people we serve" }
      - { colour: "leaf", name: "Sustainability", line: "For the land that sustains them" }
      - { colour: "saffron", name: "Self Transformation", line: "For the growth that makes change last" }

  vision:
    title: "Our *Vision*"
    text: "A world where no one goes hungry, every child can learn, the land is cared for, and every person has the chance to grow in spirit."
  mission:
    title: "Our *Mission*"
    text: "To nourish people, uplift communities and care for the land, so that every life we touch can grow in spirit as well as in strength."

  how:
    label: "How we serve"
    title: "We give, and we *stay*"
    items:
      - { colour: "coral", title: "We give, and we stay", text: "We support trusted partners on the ground and walk with each project from the first survey to the final report." }
      - { colour: "leaf", title: "We see the results", text: "Water is lab-tested, learning is tracked from baseline to endline, and harvests are recorded every month." }
      - { colour: "saffron", title: "We begin close to home", text: "Many of our projects start in the villages around Govardhan Ecovillage, where we can see needs clearly and respond with care." }

  values:
    label: "Our values"
    title: "What we *stand for*"
    items:
      - { colour: "coral", title: "Service to all", text: "Our work is open to every community, without discrimination." }
      - { colour: "rose", title: "Compassion in action", text: "Care for the whole person, body, mind and spirit, especially those who are most vulnerable." }
      - { colour: "leaf", title: "Local hands, local pride", text: "Villagers, farmers and “friends of the kund” are partners in the work, not just its beneficiaries." }
      - { colour: "water", title: "Honest results", text: "We test, measure and share what we find, including what is still in progress." }
      - { colour: "saffron", title: "Stewardship", text: "Of land, water, heritage and every rupee entrusted to us." }

  goals:
    label: "The Global Goals"
    title: "Part of a *wider* promise"
    text: "Our work contributes to the United Nations Sustainable Development Goals."
    groups:
      - colour: "coral"
        name: "Social Impact"
        goals: ["1 No Poverty", "2 Zero Hunger", "3 Good Health and Well-being", "4 Quality Education", "5 Gender Equality", "8 Decent Work and Economic Growth"]
      - colour: "leaf"
        name: "Sustainability"
        goals: ["6 Clean Water and Sanitation", "7 Affordable and Clean Energy", "13 Climate Action", "15 Life on Land"]
      - colour: "saffron"
        name: "Self Transformation"
        goals: ["4 Quality Education (values and culture)", "11 Sustainable Cities and Communities (cultural heritage)"]
    # The goals wheel lights up every goal listed above. Hovering or tapping a goal shows this line.
    wheel_line: "Nourish people · uplift communities · care for the land"
    notes:
      1: "Skills and orchards that raise family incomes in Palghar’s tribal villages."
      2: "2.4 million free meals in a year, and farms that grow food for the kitchens."
      3: "A charitable hospital in Vrindavan, a home for elders and a planned 100-bed hospital."
      4: "Better learning in 102 tribal residential schools, and values education for children."
      5: "Skills and income for rural and tribal women, and a stronger voice at home."
      6: "Safe drinking water at Govardhan Ecovillage, and sacred ponds brought back to life in Braj."
      7: "A pilot that grows crops and solar power on the same acre."
      8: "Training in tailoring, computers and electric vehicles that leads to real work."
      11: "Restoring heritage places, from a temple in Palghar to an acharya’s home in Kolkata."
      13: "Saving monsoon rain, planting trees and trying clean energy on the farm."
      15: "Fruit orchards, healthy soil and living ponds."

  trustees:
    label: "Governance"
    title: "Our *Trustees*"
    people:
      # To add a photo: upload it to src/assets/img/ and type its file name after photo:
      - name: "Harneet Hariharan (Rādhikā Līlā DD)"
        role: "Managing Trustee"
        photo: ""
        bio: "Harneet leads S3 Impact Foundation and guides its work across food, water, education, health and heritage. [A fuller background to be added]"
      - name: "Aayushi Hariharan"
        role: "Trustee"
        photo: ""
        bio: "Aayushi serves on the foundation’s board of trustees and helps shape its direction and partnerships. [A fuller background to be added]"

  accountability:
    label: "Accountability"
    title: "*Transparency* matters"
    text: "We believe partners and the public should always be able to see who we are and how we work."
    # Leave a value as "" to show "To be added"
    items:
      - { label: "Registration number", value: "" }
      - { label: "PAN", value: "" }
      - { label: "12A registration", value: "" }
      - { label: "80G registration", value: "" }
      - { label: "CSR-1 registration", value: "" }
    reports_text: "Annual reports and audited accounts will be shared here."

# ── OUR WORK ────────────────────────────────────────────────
work:
  title: "Our *Work*"
  intro: "S3 Impact Foundation invests in projects that serve people, communities and the land: from food and farming to education, water, health, elder care and culture. Here are the projects the Foundation has carried out, and those it is preparing to support next."
  image: "work-rural.webp"
  image_alt: "Women learning computer skills at Govardhan Skill Centre"
  # The groups on the page, in order. "id" must match the menu links (/our-work/#id).
  categories:
    - id: "rural"
      colour: "coral"
      title: "Rural Development at *GEV*"
      intro: "Palghar district, about 100 km north of Mumbai, is largely tribal. Farming is hard, work is seasonal, and schools and clinics can be far away. From Govardhan Ecovillage, we serve these villages where people live."
      themes:
        - { id: "farmers-agriculture", name: "Farmers & Agriculture", text: "Orchards for small farmers, a farm for the community kitchens, and a pilot that grows food and solar power on the same acre." }
        - { id: "water-resource-development", name: "Water Resource Development", text: "Safe drinking water today, and more monsoon rain saved for tomorrow." }
        - { id: "women-empowerment", name: "Women Empowerment", text: "Skills that let women earn close to home, and a stronger voice at home." }
        - { id: "skill-development", name: "Skill Development", text: "Hands-on training for growing fields, from electric vehicles to tailoring." }
        - { id: "rural-education", name: "Rural Education", text: "Better learning in tribal residential schools, and a new English-medium school on the way." }
        - { id: "healthcare-elder-care", name: "Healthcare & Elder Care", text: "A caring home for senior devotees, and a masterplan for a 100-bed hospital." }
        - { id: "animal-welfare", name: "Animal Welfare", text: "A planned sanctuary to vaccinate, sterilise and care for community dogs." }
    - id: "annakshetra"
      colour: "leaf"
      title: "Govardhan *Annakshetra*"
      intro: "One kitchen, six meal programmes and 2.4 million free meals in 2025-26, for villagers, schoolchildren, trainees and hospital patients."
    - id: "spiritual"
      colour: "saffron"
      title: "Spiritual & *Culture*"
      intro: "Some places hold a community’s heart. We help restore them and pass their values on: a temple and cultural centre that welcomed over eight lakh visitors in 2024-25, a heritage home in Kolkata, and a values curriculum for children."
    - id: "kunds"
      colour: "water"
      title: "Braj *Kunds*"
      intro: "The kunds of Braj are sacred ponds, used by villagers and by pilgrims walking the parikrama. A survey of 16 found that about 70% held water unfit even for bathing. Six are now being revived: Priya Kund, Prem Sarovar, Jal Vihar Kund, Kamal Kund, Vihval Kund and Pavan Sarovar."
    - id: "beyond"
      colour: "rose"
      title: "Beyond *GEV*"
      intro: "Our care reaches past Palghar, to a permanent campus for nearly 300 students in Pune and a charitable hospital caring for pilgrims and village families in Vrindavan."
    - id: "policy"
      colour: "water"
      title: "Policy & *Advocacy*"
      intro: "Grassroots work earns a place at bigger tables. Projects we support have helped lead a G20 civil-society working group on hunger and joined a national festival of good governance."
  upcoming:
    title: "What’s *next*"
    intro: "Seven projects are waiting for partners. Each one grows from work already under way."
    button: { label: "Partner on a project", link: "/contact/?interest=project" }

